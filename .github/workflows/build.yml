name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build Debug APK (with retry on Maven Central 429)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if gradle assembleDebug --rerun-tasks --no-parallel; then
              exit 0
            fi
            echo "Build attempt $i failed, sleeping 15s before retry..."
            sleep 15
          done
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FroggyWeather-Android16-debug
          path: app/build/outputs/apk/debug/app-debug.apk
